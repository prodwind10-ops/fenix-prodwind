pluginManagement {
    // MODIFIED — not the original Mozilla source.
    //
    // The original here did:
    //   if (!gradle.root.hasProperty("mozconfig")) { apply from: file('../gradle/mozconfig.gradle') }
    // mozconfig.gradle is a bridge into Mozilla's `mach` build orchestrator: it hard-fails
    // (GradleException) unless a config.status.json file exists, which is only produced by
    // running `./mach configure` inside a full mozilla-central checkout with Mozilla's Python
    // build tooling. That's not available here, so mozconfig.gradle is not applied at all.
    //
    // org.mozilla.conventions.settings (applied below, from ../gradle/plugins/conventions) reads
    // gradle.ext.mozconfig.topsrcdir directly and unconditionally (SettingsPlugin.loadBuildConfig),
    // to locate mobile/android/android-components/.buildconfig.yml. That's the one key this build
    // actually needs from the real mozconfig map, so it's supplied directly here rather than
    // reconstructing the much larger `substs` structure mozconfig.gradle would normally build.
    gradle.ext.mozconfig = [topsrcdir: rootProject.projectDir.absolutePath.minus("mobile/android/fenix")]

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://maven.mozilla.org/maven2" }
    }

    includeBuild("../gradle/plugins/conventions")
    includeBuild("../android-components/plugins/publicsuffixlist")
    includeBuild("../android-components/plugins/dependencies")
    includeBuild("../android-components/plugins/config")
    includeBuild("./plugins/apksize")
    includeBuild("../gradle/plugins/nimbus-gradle-plugin")
}

plugins {
    id 'org.mozilla.conventions.settings'
    id 'mozac.DependenciesPlugin'
}

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files("../../../gradle/libs.versions.toml"))
        }
    }
}

ext.topsrcdir = rootProject.projectDir.absolutePath.minus("mobile/android/fenix")

apply from: file('../shared-settings.gradle')

// MODIFIED — the original guarded application-services inclusion on
// gradle.ext.mozconfig.substs.*, which no longer exists (see above). Since
// application-services (third_party/application-services) is not present in
// this build's source tree at all, this block is skipped unconditionally
// rather than guessing at the substs values it depended on.

include ':app'
include ':app:longfox'
include ':mozilla-detekt-rules'
include ':benchmark'

mozilla {
    disableAndroidComponentsTasks = true
}

def projectLocalProperties = file("local.properties").with { localPropertiesFile ->
    def localProperties = new Properties()
    if (localPropertiesFile.canRead()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }
    localProperties
}
projectLocalProperties.each { prop ->
    gradle.ext."localProperties.${prop.key}" = prop.value
}
