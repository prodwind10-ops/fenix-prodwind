pluginManagement {
    // ---------------------------------------------------------------------------------------
    // Emulated Mozilla build configuration (NOT part of the upstream source).
    //
    // In mozilla-central, ../gradle/mozconfig.gradle builds `gradle.mozconfig` from the
    // config.status.json that `./mach configure` writes. This repository only contains the
    // mobile/android slice of the tree, so that file can never exist here. Instead we supply
    // the small set of values the Gradle build actually reads, and create the few "objdir"
    // inputs that `./mach build` would normally generate. Everything is derived from paths
    // inside this checkout, so it behaves the same locally and on CI.
    //
    // What each value is for:
    //  - topsrcdir / topobjdir: the conventions plugin finds .buildconfig.yml and redirects every
    //    project's build directory to ${topobjdir}/gradle/build/<project path>. Build outputs
    //    (including the APK) therefore land under .topobjdir/, not under each project's build/.
    //  - MOZ_APP_VERSION / MOZ_UPDATE_CHANNEL / MOZ_ANDROID_FAT_AAR_ARCHITECTURES and the build ID
    //    below: engine-gecko resolves GeckoView from Mozilla's Maven as
    //    org.mozilla.geckoview:geckoview-nightly-omni:<major>.<minor>.<build id>. A fat-AAR value
    //    keeps that coordinate free of the "-SNAPSHOT" and per-ABI suffixes (which only exist for
    //    local Gecko builds / automation).
    //  - ANDROID_BUILD_TOOLS_VERSION: read unconditionally by ProjectPlugin.
    //  - Anything not listed (MOZILLA_OFFICIAL, MOZ_AUTOMATION, GRADLE_GLEAN_PARSER_VENV, ...) is
    //    deliberately left undefined, which is what a plain local debug build looks like.
    // ---------------------------------------------------------------------------------------
    def topsrcdir = rootProject.projectDir.toPath().resolve("../../..").normalize().toString()
    def topobjdir = new File(topsrcdir, ".topobjdir").path
    new File(topobjdir).mkdirs()

    // Firefox version of this source snapshot, from mobile/android/version.txt (first line).
    def appVersion = new File(topsrcdir, "mobile/android/version.txt").readLines().first().trim()

    // 14-digit build ID of the GeckoView nightly this snapshot is built against. The environment
    // variable MOZ_BUILD_DATE takes precedence (that is how the build already reads it); the
    // default is a published geckoview-nightly-omni build from the same day as the snapshot's
    // application-services pin (see ApplicationServices.kt), 2026-09-16.
    def geckoBuildId = System.getenv("MOZ_BUILD_DATE") ?: "20260916202159"
    new File(topobjdir, "buildid.h").text = "#define MOZ_BUILDID ${geckoBuildId}\n"

    // lib-crash compiles CrashReport.kt, which Mozilla's build system generates from
    // toolkit/crashreporter/CrashAnnotations.yaml (not part of this slice). This stand-in declares
    // exactly the annotation names the Kotlin sources in this repository reference.
    def crashAnnotations = [
        "AndroidComponentVersion", "Android_Board", "Android_Brand", "Android_CPU_ABI",
        "Android_CPU_ABI2", "Android_Device", "Android_Display", "Android_Fingerprint",
        "Android_Hardware", "Android_Manufacturer", "Android_Model", "Android_PackageName",
        "Android_ProcessName", "Android_Version", "ApplicationBuildID",
        "ApplicationServicesVersion", "Breadcrumbs", "BuildID", "CPUArchitecture",
        "CrashEventID", "CrashTime", "CrashType", "DistributionID", "GeckoViewVersion",
        "GleanVersion", "InstallTime", "JavaException", "JavaStackTrace",
        "MinidumpSha256Hash", "OS", "OSVersion", "ProcessType", "ProductID", "ProductName",
        "ReleaseChannel", "RemoteType", "StartupTime", "Vendor", "Version",
        "additional_minidumps", "useragent_locale",
    ]
    def crashServiceDir = new File(topobjdir,
        "mobile/android/android-components/components/lib/crash/src/main/java/mozilla/components/lib/crash/service")
    crashServiceDir.mkdirs()
    new File(crashServiceDir, "CrashReport.kt").text = """\
/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at http://mozilla.org/MPL/2.0/. */

package mozilla.components.lib.crash.service

/**
 * Stand-in for the CrashReport.kt that Mozilla's build system generates from
 * toolkit/crashreporter/CrashAnnotations.yaml. Only annotations referenced by this source tree are
 * declared; each entry name is the annotation key (the enum's toString() is its name).
 */
object CrashReport {
    @Suppress("EnumNaming", "EnumEntryName")
    enum class Annotation {
${crashAnnotations.collect { "        ${it}," }.join("\n")}
    }
}
"""

    gradle.ext.mozconfig = [
        topsrcdir: topsrcdir,
        topobjdir: topobjdir,
        substs: [
            ANDROID_BUILD_TOOLS_VERSION: "36.0.0",
            MOZ_APP_VERSION: appVersion,
            MOZ_UPDATE_CHANNEL: "nightly",
            MOZ_ANDROID_FAT_AAR_ARCHITECTURES: "armeabi-v7a,arm64-v8a,x86_64,x86",
        ],
    ]

    // mozconfig.gradle also defines gradle.ext.configureMavenRepositories, which the included
    // plugin builds call as `gradle.configureMavenRepositories(delegate)`. Mozilla's own Maven
    // hosts GeckoView, application-services and Glean.
    gradle.ext.configureMavenRepositories = { repositoryHandler ->
        repositoryHandler.google()
        repositoryHandler.mavenCentral()
        repositoryHandler.gradlePluginPortal()
        repositoryHandler.maven { url "https://maven.mozilla.org/maven2" }
        repositoryHandler.maven { url "https://nightly.maven.mozilla.org/maven2" }
    }

    repositories {
        gradle.configureMavenRepositories(delegate)
    }

    includeBuild("../gradle/plugins/conventions")
    includeBuild("../android-components/plugins/publicsuffixlist")
    includeBuild("../android-components/plugins/dependencies")
    includeBuild("../android-components/plugins/config")
    includeBuild("./plugins/apksize")
    includeBuild("../gradle/plugins/nimbus-gradle-plugin")
}

plugins {
    id 'org.mozilla.conventions.settings'
    id 'mozac.DependenciesPlugin'
}

dependencyResolutionManagement {
    repositories {
        gradle.configureMavenRepositories(delegate)
    }
    versionCatalogs {
        libs {
            from(files("../../../gradle/libs.versions.toml"))
        }
    }
}

ext.topsrcdir = rootProject.projectDir.absolutePath.minus("mobile/android/fenix")

apply from: file('../shared-settings.gradle')

// application-services is consumed as published Maven artifacts (see ApplicationServices.kt), so it is
// not included in-tree here.

include ':app'
include ':app:longfox'
include ':mozilla-detekt-rules'
include ':benchmark'

mozilla {
    disableAndroidComponentsTasks = true
}

def projectLocalProperties = file("local.properties").with { localPropertiesFile ->
    def localProperties = new Properties()
    if (localPropertiesFile.canRead()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }
    localProperties
}
projectLocalProperties.each { prop ->
    gradle.ext."localProperties.${prop.key}" = prop.value
}
