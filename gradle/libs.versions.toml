# RECONSTRUCTED FILE — not part of the original Mozilla source.
#
# fenix/settings.gradle and android-components/settings.gradle both load
# their dependency version catalog from this exact path
# (../../../gradle/libs.versions.toml relative to each project). The real
# file was not present in any of the zips provided for this build, so this
# is a best-effort reconstruction built from every `libs.*` reference found
# in fenix's and android-components' own build files.
#
# WHAT'S RELIABLE: the [libraries]/[plugins] *names* and *aliases* below are
# real — extracted directly from the actual build.gradle files, not guessed.
# Getting an alias name wrong is a hard, immediate Gradle error, so this
# part should be structurally complete for what fenix/app/build.gradle and
# fenix/build.gradle reference.
#
# WHAT'S GUESSED: every *version number* below. I have no way to know the
# exact versions actually pinned in Mozilla's real catalog for this specific
# build. These are current, mutually-reasonable versions as a starting
# point, not extracted or verified values. EXPECT VERSION MISMATCHES.
# Gradle's own dependency-resolution errors, once you run a real build, will
# tell you precisely which of these need adjusting — that feedback will be
# far more precise than anything guessed here. Treat this file as a
# first draft, not a finished catalog.
#
# WHAT'S LIKELY INCOMPLETE: this only covers libs.* references in the two
# projects' *top-level* build files. android-components has 150+ individual
# component modules (components/*/*/build.gradle), each of which may
# reference additional catalog entries not enumerated here. Any such gap
# will surface as "Unresolved reference: xyz" pointing at a specific
# build.gradle file — add the missing alias below when that happens.

