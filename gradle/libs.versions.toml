# MODIFIED / NEW — not found by static libs.* grepping. gradle/plugins/conventions'
# Ktfmt.kt looks this up dynamically at runtime via VersionCatalogsExtension.findVersion("ktfmt")
# and .findLibrary("ktfmt") (both by literal string, not a compile-time libs.ktfmt accessor), so it
# was missed by every earlier static-reference sweep of this catalog. The alias name below must
# stay exactly "ktfmt" to match those literal string lookups.
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
# MODIFIED / NEW — same dynamic-lookup situation as ktfmt above: ProjectPlugin.kt's
# configureDetekt() calls findLibrary("detekt-cli") by literal string. Unlike ktfmt, this specific
# call sits inside a lazy project.provider { } that assembleDebug likely never triggers (Detekt's
# classpath is only resolved if something actually consumes the "detektCli" configuration), so
# this is added defensively rather than confirmed necessary. Detekt has since moved its Maven
# group from io.gitlab.arturbosch.detekt to dev.detekt alongside a 2.0.0 release; 1.23.8 (the
# last version under the old, confirmed-stable coordinates) is used here deliberately rather than
# guessing at the exact dev.detekt cutover version, since this dependency is expected to be
# unreachable for a debug assemble anyway.
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
