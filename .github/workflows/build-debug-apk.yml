name: Build debug APK

# MODIFIED / NEW FILE — not part of the original Mozilla source. Fenix's real CI is Jenkins-based
# (see mobile/android/fenix/Jenkinsfile); this is a from-scratch GitHub Actions workflow for
# building a personal debug APK from this repo's checked-in monorepo-sibling layout
# (mobile/android/fenix, mobile/android/android-components, gradle/ — see
# mobile/android/fenix/settings.gradle and mobile/android/android-components/settings.gradle for
# why that exact layout matters).
#
# KNOWN UNCERTAINTY: the surrounding build files (settings.gradle, app/build.gradle,
# gradle/libs.versions.toml) were reconstructed by hand against real source with no ability to
# actually run Gradle and confirm they evaluate correctly — see the "MODIFIED" comments throughout
# those files for specifics. This workflow may need iteration based on real failures it surfaces.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/fenix/**'
      - 'mobile/android/android-components/**'
      - 'gradle/**'
      - '.github/workflows/build-debug-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # No submodules / sparse-checkout assumptions: mobile/android/fenix,
        # mobile/android/android-components, and gradle/ are expected to already be committed as
        # ordinary sibling directories in this repo — see the header comment above.

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          # The wrapper being validated lives in mobile/android/fenix, not the repo root.
          workspace: mobile/android/fenix

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile/android/fenix
          # Cache android-components and gradle/ build outputs too, since they're consumed as
          # included builds from fenix and will otherwise be rebuilt from scratch every run.
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/android/fenix/gradlew

      - name: Assemble debug APK
        working-directory: mobile/android/fenix
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          # Keeps Gradle's memory footprint predictable on GitHub-hosted runners; adjust if the
          # build gets OOM-killed.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

      - name: Locate built APK(s)
        id: find_apk
        working-directory: mobile/android/fenix
        run: |
          echo "Searching for assembled debug APKs..."
          find app/build/outputs/apk/debug -iname "*.apk" -print
          apk_count=$(find app/build/outputs/apk/debug -iname "*.apk" | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No debug APK found under app/build/outputs/apk/debug — the assemble task likely failed silently or output to an unexpected path."
            exit 1
          fi

      - name: Upload debug APK(s)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-debug-apk
          path: mobile/android/fenix/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            mobile/android/fenix/**/build/reports/**
            mobile/android/fenix/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
